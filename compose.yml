name: dasbot
services:
  dasbot:
    container_name: dasbot
    build: .
    image: dasbot:local
    restart: unless-stopped
    env_file: .env
    environment:
      DYNACONF_DB_ADDRESS: "postgresql://dasbot:dasbot@postgres:5432/dasbot"
    ports:
      - 127.0.0.1:8082:8080
    volumes:
      - .:/usr/src/app
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dasbot
      POSTGRES_USER: dasbot
      POSTGRES_PASSWORD: dasbot
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dasbot -d dasbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres18_data:
    name: postgres18_data
